name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch exact E7C source for the Joint pilot test
        run: |
          git init "$RUNNER_TEMP/pinned-e7c"
          git -C "$RUNNER_TEMP/pinned-e7c" remote add origin https://github.com/E7GT-Ecosystem/E7G-T.git
          git -C "$RUNNER_TEMP/pinned-e7c" fetch --depth=1 origin 5b5cb5f10ddd913df66f5d9f65fbe059a2e33193
          git -C "$RUNNER_TEMP/pinned-e7c" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/pinned-e7c" rev-parse HEAD)" = 5b5cb5f10ddd913df66f5d9f65fbe059a2e33193
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test]"
      - run: python scripts/check_licensing_boundary.py
      - run: python scripts/test_licensing_boundary.py
      - run: python -m pytest -q tests
        env:
          E7C_ROOT: ${{ runner.temp }}/pinned-e7c

  simulation-reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[test,simulation-test]"
      - run: python scripts/check_licensing_boundary.py
      - run: python scripts/test_licensing_boundary.py
      # The pinned-source suite runs in the matrix job and its dedicated workflow.
      - run: python -m pytest -q tests --ignore=tests/test_e7c_joint_pilot.py

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "e7q"
version = "1.0.0rc12"
description = "Evidence-native quantum intermediate representation and assurance toolkit"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]
license = {text = "Apache-2.0"}
authors = [
  {name = "Oleksandr Razinkov"},
]

[project.scripts]
e7q = "e7q.cli:main"

[project.optional-dependencies]
test = ["pytest>=8", "jsonschema>=4"]
stabilizer = ["stim==1.16.0"]
simulation-test = ["stim==1.16.0", "qiskit==2.5.2", "jsonschema>=4"]
qcec = ["mqt.qcec==3.9.0"]
pyzx = ["pyzx==0.10.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]

# The standard e7q distribution contains only the Apache open-core package.
[tool.setuptools.packages.find]
where = ["src"]
include = ["e7q", "e7q.*"]
namespaces = false
